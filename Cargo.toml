[workspace]
resolver = "3"
members = ["crates/cad-core", "crates/cad-app"]
# Both crates are default members so `cargo test` covers the core, while
# `cargo run` resolves to the only binary in the workspace (cad-app).
default-members = ["crates/cad-core", "crates/cad-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cad-core = { path = "crates/cad-core" }
# Bevy is pinned to an exact release; every API in cad-app targets 0.19.1.
bevy = { version = "=0.19.1", default-features = false, features = ["3d", "ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Bevy is very slow without optimizations; optimize dependencies even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
